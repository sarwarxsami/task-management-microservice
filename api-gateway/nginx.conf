events {}

http {
    include /etc/nginx/mime.types;
    server_tokens off;

    server {
        listen 80;
        server_name task.sarwarxsami.me;

        # Let's Encrypt HTTP-01 challenge (certbot --webroot -w /var/www/certbot)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name task.sarwarxsami.me;

        ssl_certificate /etc/letsencrypt/live/task.sarwarxsami.me/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/task.sarwarxsami.me/privkey.pem;

        # browsers remember to use HTTPS only (no includeSubDomains: other subdomains may not have TLS)
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

        # serve frontend
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # trailing slash on each service prefix, so e.g. /service/task-serviceX does not match
        location /service/task-service/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://task-service:8080;
        }

        location /service/user-service/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://user-service:3000;
        }

        location /service/social-service/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://social-service:8080;
        }
    }
}
