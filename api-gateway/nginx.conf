events {}

http {
    server {
        listen 80;
        server_name task.sarwarxsami.me;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name task.sarwarxsami.me;

        ssl_certificate /etc/letsencrypt/live/task.sarwarxsami.me/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/task.sarwarxsami.me/privkey.pem;

        location /service/task-service {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://task-service:8080;
        }

        location /service/user-service {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://user-service:3000;
        }
    }
}