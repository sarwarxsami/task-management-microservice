name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: ci
      DB_USER: ci
      DB_PASSWORD: ci
      JWT_SECRET: ci-secret-that-is-at-least-32-characters-long
      INTERNAL_API_KEY: ci-internal-key-that-is-at-least-32-characters

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Validate nginx.conf
        run: |
          docker run --rm \
            -v "$PWD/api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro" \
            --add-host task-service:127.0.0.1 --add-host user-service:127.0.0.1 --add-host social-service:127.0.0.1 \
            --entrypoint sh nginx:1.31-alpine -c '
              apk add --no-cache openssl >/dev/null &&
              mkdir -p /etc/letsencrypt/live/task.sarwarxsami.me &&
              cd /etc/letsencrypt/live/task.sarwarxsami.me &&
              openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj "/CN=test" \
                -keyout privkey.pem -out fullchain.pem 2>/dev/null &&
              nginx -t'

      - name: Apply database schema
        run: PGPASSWORD=ci psql -h localhost -U ci -d ci -v ON_ERROR_STOP=1 -f db/init.sql

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test user-service
        working-directory: user-service
        run: |
          npm ci
          npm test

      - name: Check frontend
        run: node --check frontend/app.js

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Test task-service
        working-directory: task-service
        run: mvn -B test

      - name: Test social-service
        working-directory: social-service
        run: mvn -B test

  build-and-push:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push task-service
        uses: docker/build-push-action@v5
        with:
          context: ./task-service
          push: true
          tags: |
            sarwarxsami/task-service:latest
            sarwarxsami/task-service:${{ github.sha }}

      - name: Build and push user-service
        uses: docker/build-push-action@v5
        with:
          context: ./user-service
          push: true
          tags: |
            sarwarxsami/user-service:latest
            sarwarxsami/user-service:${{ github.sha }}

      - name: Build and push social-service
        uses: docker/build-push-action@v5
        with:
          context: ./social-service
          push: true
          tags: |
            sarwarxsami/social-service:latest
            sarwarxsami/social-service:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "./docker-compose.yml,db/init.sql,./api-gateway/nginx.conf,./frontend"
          target: /home/ubuntu/task-management-microservice
          strip_components: 0

      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
                  set -eo pipefail
                  cd /home/ubuntu/task-management-microservice
                  sudo mkdir -p /var/www/certbot
                  # free space from images left behind by earlier deploys (running containers keep theirs)
                  sudo docker image prune -af
                  sudo docker builder prune -af
                  df -h /
                  export TAG=${{ github.sha }}
                  sudo env IMAGE_TAG=$TAG docker compose pull
                  sudo env IMAGE_TAG=$TAG docker compose up -d --wait db
                  # back up, then apply the idempotent schema migration
                  mkdir -p ~/backups
                  sudo docker compose exec -T db sh -c 'pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB"' | gzip > ~/backups/db-$(date +%Y%m%d-%H%M%S).sql.gz
                  ls -1t ~/backups/db-*.sql.gz | tail -n +11 | xargs -r rm --
                  # piped from the host: the container's bind-mounted copy is stale after scp replaces the file
                  sudo docker compose exec -T db sh -c 'psql -q -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' < db/init.sql
                  sudo env IMAGE_TAG=$TAG docker compose up -d --wait --remove-orphans
                  # re-mount the updated nginx.conf and re-resolve recreated upstream containers
                  sudo docker compose restart nginx
                  sudo docker image prune -af
                  df -h /

      - name: Smoke test
        run: |
          for path in / /service/user-service/health /service/task-service/health /service/social-service/health; do
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "https://task.sarwarxsami.me$path" || true)
              [ "$code" = "200" ] && break
              sleep 5
            done
            echo "$path -> $code"
            [ "$code" = "200" ]
          done
          # protected endpoints must reject anonymous requests
          for path in /service/user-service/users /service/task-service/tasks /service/social-service/discover; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://task.sarwarxsami.me$path")
            echo "$path (no token) -> $code"
            [ "$code" = "401" ]
          done
