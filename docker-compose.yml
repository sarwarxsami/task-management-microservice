services:
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    networks:
      - user-net
      - task-net
    depends_on:
      - task-service
      - user-service
    volumes:
      - ./api-gateway/nginx.conf:/etc/nginx/nginx.conf
  db:
    image: postgres:latest
    container_name: postgres-db
    volumes:
      - new-vol:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=postgresdb
    networks:
      - user-net
      - task-net

  task-service:
    image: sarwarxsami/task-service:latest
    container_name: task-service
    networks:
      - task-net
    env_file:
      - ./.env
    depends_on:
      - db

  user-service:
    image: sarwarxsami/user-service
    container_name: user-service
    networks:
      - user-net
    env_file:
      - ./.env
    depends_on:
      - db

volumes:
  new-vol:

networks:
  user-net:
  task-net: