services:
  nginx:
    image: nginx:1.31-alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - task-service
      - user-service
      - social-service
    networks:
      - task-net
      - user-net
    mem_limit: 64m
    restart: unless-stopped

  db:
    image: postgres:18
    container_name: postgres-db
    volumes:
      - new-vol:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      - POSTGRES_USER=${DB_USER:?DB_USER must be set in .env}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      - POSTGRES_DB=${DB_NAME:?DB_NAME must be set in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - user-net
      - task-net
    mem_limit: 384m
    restart: unless-stopped

  task-service:
    image: sarwarxsami/task-service:${IMAGE_TAG:-latest}
    container_name: task-service
    networks:
      - task-net
    env_file:
      - ./.env
    environment:
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set in .env}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/service/task-service/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped

  user-service:
    image: sarwarxsami/user-service:${IMAGE_TAG:-latest}
    container_name: user-service
    networks:
      - user-net
    env_file:
      - ./.env
    environment:
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set in .env}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/service/user-service/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 256m
    restart: unless-stopped

  social-service:
    image: sarwarxsami/social-service:${IMAGE_TAG:-latest}
    container_name: social-service
    # talks to user-service (user-net) and task-service (task-net)
    networks:
      - user-net
      - task-net
    env_file:
      - ./.env
    environment:
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set in .env}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/service/social-service/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      user-service:
        condition: service_started
      task-service:
        condition: service_started
    mem_limit: 512m
    restart: unless-stopped

volumes:
  new-vol:

networks:
  user-net:
  task-net:
