spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# Shared with user-service, which issues the tokens
app.jwt.secret=${JWT_SECRET}

# Service-to-service calls to user-service and task-service
app.internal.key=${INTERNAL_API_KEY}
app.user-service.url=${USER_SERVICE_URL:http://user-service:3000}
app.task-service.url=${TASK_SERVICE_URL:http://task-service:8080}
