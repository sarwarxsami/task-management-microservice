spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# Schema is owned by db/init.sql; Hibernate must not alter shared tables
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Shared with user-service, which issues the tokens
app.jwt.secret=${JWT_SECRET}

# Shared key for service-to-service calls (social-service)
app.internal.key=${INTERNAL_API_KEY}
